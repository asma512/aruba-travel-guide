<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact our Aruba travel experts to help plan your island getaway.">
    <title>Plan Your Trip | ArubaGuide</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <div class="logo">ArubaGuide</div>
            <nav aria-label="Main Navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Explore</a></li>
                    <li><a href="activities.html" aria-current="page">Things to Do</a></li>
                    <li><a href="contact.html" aria-current="page">Plan Your Trip</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <section class="form-section">
            <h1>Let's Plan Your Getaway</h1>
            <p>Have questions about accommodations, tours, or the best time to visit? Send us a message and our local experts will get back to you.</p>
            
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="travelerName">Full Name:</label>
                    <input type="text" id="travelerName" name="travelerName" required>
                </div>

                <div class="form-group">
                    <label for="travelerEmail">Email Address:</label>
                    <input type="email" id="travelerEmail" name="travelerEmail" required>
                </div>

                <div class="form-group">
                    <label for="travelDates">Estimated Travel Dates:</label>
                    <input type="text" id="travelDates" name="travelDates" placeholder="e.g., May 10 - May 17" required>
                </div>

                <div class="form-group">
                    <label for="travelerMessage">What can we help you with?</label>
                    <textarea id="travelerMessage" name="travelerMessage" rows="5" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </section>
    </main>

    <footer class="site-footer fixed-bottom">
        <div class="container">
            <p>&copy; 2026 ArubaGuide Website. Built for educational purposes.</p>
        </div>
    </footer>
</body>
</html>
